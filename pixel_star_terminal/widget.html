<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIXEL STAR · 桌面小组件</title>


<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cockpit.css">
</head>
<body class="widget-body">
<div class="w-panel">
  <div class="w-head">
    <span class="w-title">◉ TODAY <span id="wDate">--/--</span></span>
    <a class="w-open" href="index.html" target="_blank" title="打开主控台">▣</a>
  </div>
  <div class="w-prog-row">
    <div class="pbar"><i id="wBar" style="width:0%"></i></div>
    <span class="w-pct" id="wPct">0/0</span>
  </div>
  <div class="w-add">
    <input id="wInput" class="px-input" placeholder="添加今日任务，回车确认..." maxlength="60">
    <button id="wAdd" class="px-btn primary">＋</button>
  </div>
  <ul id="wList" class="w-list"></ul>
  <div id="wEmpty" class="w-empty">// 今日暂无任务</div>
  <div class="w-foot">PIXEL STAR WIDGET v2.1</div>
</div>
<script src="js/store.js"></script>
<script src="js/sfx.js"></script>
<script src="js/widget.js"></script>
<script src="js/accessibility.js"></script></body>
</html>
